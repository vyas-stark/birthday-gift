<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#08090d">
    <title>A story waiting to be opened</title>
    <link rel="stylesheet" href="loading.css">
</head>

<body>
    <main class="threshold" aria-live="polite">
        <div class="grain" aria-hidden="true"></div>
        <div class="star-field" aria-hidden="true"></div>
        <p class="eyebrow">A private story, for one person</p>
        <h1>A story<br><em>waiting to be opened...</em></h1>
        <div class="progress-wrap" aria-label="Loading story">
            <span class="progress-line"><span class="progress-fill"></span></span>
            <span class="progress-number">00</span>
        </div>
        <p class="threshold-note">Please wait a moment</p>
    </main>
    <script src="loading.js"></script>
</body>

</html>
