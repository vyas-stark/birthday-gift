<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b1015">
    <title>Open the book</title>
    <link rel="stylesheet" href="book.css">
</head>

<body>
    <main class="book-stage">
        <div class="stage-copy">
            <p class="kicker">A story in chapters</p>
            <h1>For <em>Mummy</em></h1>
            <p class="hint">Some things are better opened slowly.</p>
        </div>
        <div class="book-shell" id="book" role="button" tabindex="0" aria-label="Open the book">
            <div class="book-cover"><span class="cover-rule"></span>
                <p>For</p><strong>Mummy</strong><small>A story by your son</small><span class="cover-rule"></span>
            </div>
            <div class="book-inside">
                <div class="page left-page"></div>
                <div class="page right-page"><span>Something is waiting for you Mummy 😜
                </span></div>
            </div>
        </div>
        <button class="open-button" type="button">Click to open the book mummy 😁<span>↗</span></button>
        <p class="footer-note">Tap the cover to begin</p>
    </main>
    <script src="book.js"></script>
</body>

</html>
