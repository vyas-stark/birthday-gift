<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#08090d">
    <title>For Mummy</title>
    <link rel="stylesheet" href="letter.css">
</head>

<body>
    <main class="letter-scene">
        <article class="letter-paper">
            <p class="letter-kicker">The last page</p>
            <h1>For Mummy</h1>
            <div class="letter-body">
                <p>[YOUR FINAL LETTER WILL GO HERE]</p>
            </div>
            <p class="sign-off">— Your Son</p><button class="read-button" type="button">I have read this
                <span>→</span></button>
        </article>
        <section class="end-screen" aria-live="polite">
            <p class="end-kicker">The story closes here</p>
            <h2>The end</h2>
            <p>Some stories are written.<br>Some just happen.</p>
        </section>
    </main>
    <script src="letter.js"></script>
</body>

</html>
